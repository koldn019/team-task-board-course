apiVersion: apps/v1
kind: Deployment
metadata:
  name: team-task-board
  labels:
    app: team-task-board
spec:
  replicas: 1
  selector:
    matchLabels:
      app: team-task-board
  template:
    metadata:
      labels:
        app: team-task-board
    spec:
      containers:
        - name: web
          image: course-web:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
