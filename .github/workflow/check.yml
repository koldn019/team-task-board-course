name: Pull request checks

on:
  pull_request:
    branches: [main]

permissions: 
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run Team Task Board Tests
        run: python -m unittest discover -s tests
  